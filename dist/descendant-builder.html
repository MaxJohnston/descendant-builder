/* Descendant Builder styles.
   Layout: toolbar over a framed, pannable descendant chart; generations run left to right in columns. */

/* Page basics */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
/* Layout: toolbar over a framed, pannable descendant chart. Generations run left to right in columns, the details popover floats above the stage so it never scales with zoom. */
:root{
  --bg:#EBF0EE; --surface:#F9FBFA; --band:#F0F4F3; --head-h:34px;
  --fg:#15201D; --muted:#566664;
  --rule:#AEBCB8; --rule-soft:#D2DCD9;
  --b0:#2C66B0; --b1:#B03F68; --b2:#A86F0C; --b3:#23805E; --b4:#6B4FB4; --b5:#0E7C86; --b6:#B4532A; --b7:#5F7A1E;
  --star:#6B46B4; --star-fg:#fff; --hy:#1B6A8E; --hm:#9B3F86; --hap-fg:#fff; --dna:#0B7A75; --dna-fg:#fff;
  --edit:#A4461A; --edit-bg:#FBEDE4; --danger:#B42318; --scrim:rgba(12,20,18,.42);
  --font-display:'Newsreader',Georgia,'Times New Roman',serif;
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1615; --surface:#172120; --band:#1B2726;
    --fg:#E6EDEB; --muted:#92A3A0;
    --rule:#42524F; --rule-soft:#2A3835;
    --b0:#86B3EA; --b1:#EE92B0; --b2:#E6B656; --b3:#6FCFA3; --b4:#B79BEA; --b5:#5FC9D3; --b6:#F0A27A; --b7:#B5CF6A;
    --star:#B79BEA; --star-fg:#14100F; --hy:#7CC3E6; --hm:#E39AD1; --hap-fg:#0F1615; --dna:#5FD0C4; --dna-fg:#0F1615;
    --edit:#F2A374; --edit-bg:#2B211B; --danger:#F49A8F; --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1615; --surface:#172120; --band:#1B2726;
  --fg:#E6EDEB; --muted:#92A3A0;
  --rule:#42524F; --rule-soft:#2A3835;
  --b0:#86B3EA; --b1:#EE92B0; --b2:#E6B656; --b3:#6FCFA3; --b4:#B79BEA; --b5:#5FC9D3; --b6:#F0A27A; --b7:#B5CF6A;
  --star:#B79BEA; --star-fg:#14100F; --hy:#7CC3E6; --hm:#E39AD1; --hap-fg:#0F1615; --dna:#5FD0C4; --dna-fg:#0F1615;

  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.45;
  padding-inline:16px;padding-block:14px;

}
a{color:var(--fg);text-underline-offset:2px}

.status{margin:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lc,var(--rule));flex:none}

.stage{position:relative;flex:1;min-height:340px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);overflow:hidden}
.viewport{position:absolute;inset:var(--head-h) 0 0 0;overflow:auto;cursor:grab;overscroll-behavior:contain;touch-action:pan-x pan-y}

.sizer{position:relative}
.world{position:absolute;left:0;top:0;transform-origin:0 0}

.lines path{fill:none;stroke:var(--lc,var(--rule));stroke-width:1.5;vector-effect:non-scaling-stroke}
/* side-by-side forks in one gap: three variations of the line colour (hue turned a little, lighter or darker);
   browsers without relative colours fall back to a lighter or darker mix */

.heads{position:absolute;left:0;top:0;right:0;height:var(--head-h);z-index:3;overflow:hidden;background:var(--surface);border-bottom:1px solid var(--rule)}
.hin{position:absolute;left:0;top:0;height:100%}
.hd{position:absolute;top:0;height:100%;display:flex;align-items:center;gap:8px;padding-inline:8px;white-space:nowrap;overflow:hidden;font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hd.alt{background:var(--band)}
.hd b{font:500 11px var(--font-mono);color:var(--fg);letter-spacing:0;flex:none}

.hd.num .tx{display:none}

.card{
  position:absolute;width:256px;height:48px;display:flex;align-items:center;gap:0;
  padding-left:11px;padding-right:3px;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;
}
/* skip drawing cards that are off screen (big trees); not for cards whose button, ring or highlight reaches outside */
.card:not(.hasmore):not(.open):not(.refhl):not(.target):not(:focus-within){content-visibility:auto;contain-intrinsic-size:auto 256px auto 48px}
.card.root{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

.yr{display:flex;align-items:center;gap:6px;font:400 11px/1.2 var(--font-mono);color:var(--muted)}
.card.root .yr{color:inherit;opacity:.78}
.card.root .dot{display:none}
.ico{
  width:26px;height:36px;display:grid;place-items:center;flex:none;padding:0;text-decoration:none;
  border:0;border-radius:5px;background:transparent;color:var(--muted);cursor:pointer;
}
.card.root .ico{color:inherit}
.ico:hover{color:var(--fg);background:var(--band)}
.card.root .ico:hover{background:transparent;opacity:.8}
.ico[aria-expanded="true"] svg{transform:rotate(180deg)}
.wglyph{display:grid;place-items:center;width:17px;height:17px;border:1.4px solid currentColor;border-radius:50%;font:600 11px/1 var(--font-display)}
.beyond{
  position:absolute;right:-19px;top:50%;transform:translateY(-50%);width:16px;height:28px;

.pop{
  position:absolute;z-index:5;width:min(360px,calc(100% - 16px));max-height:calc(100% - 16px);overflow:auto;overscroll-behavior:contain;
  background:var(--surface);color:var(--fg);border:1px solid var(--rule);border-radius:10px;

/* Desktop: the relatives list is a vertical panel on the left and the chart fills the rest.

  .menu{position:fixed;left:16px;right:16px;top:auto;max-width:none}

/* read-only copy: no edit mode, and no saving another read-only copy (it needs the app's own files) */
body.readonly #edit,body.readonly #editbar,body.readonly [data-ro],body.readonly .mfs+hr{display:none!important}

/* ---------- descendant chart ---------- */
@media (min-width:641px){ .stage{flex:1} }
.lines path.mar{stroke:var(--rule);stroke-width:1.5}
.card.sp{background:var(--bg);border-style:solid;border-color:var(--rule-soft)}
.card.sp .nm{font-size:14px}
.card.sp.linked{border-style:dashed;border-color:var(--rule)}
.ring{display:inline-grid;place-items:center;color:var(--muted);flex:none}
.card.refcard{background:transparent}
.card.root .ring{color:inherit}
.beyond{right:-40px;width:36px;gap:1px;display:flex;align-items:center;justify-content:center;font:500 11px var(--font-mono);border:1px solid var(--rule-soft);border-radius:99px;height:22px;background:var(--surface);cursor:pointer;padding:0 2px}
.beyond span{font-size:10.5px}
.beyond:hover{border-color:var(--fg)}
.legend .lgb{display:flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;color:var(--fg);font:inherit;cursor:pointer}
.legend .lgb:hover span{text-decoration:underline;text-underline-offset:2px}
.legend .lgb span{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .yr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .yr .mute{color:var(--muted)}
.card.famous .nm::after{content:" \2605";color:var(--star);font-size:12px}
.card.root.famous .nm::after{color:inherit}
.pop .actions .btn svg{margin-right:6px}
.sub .linkbtn{color:var(--fg)}
.fwrap .kicker{margin:0}
.filein input{width:100%}

.rootpick{display:grid;gap:8px}
.rootpick .combo{position:relative;display:block}
.rootpick .combolist.rplist{position:static;max-height:240px;overflow:auto;display:block}
.rootpick li.cur{outline:2px solid var(--star);outline-offset:-2px}
</style>

<script data-db>

var person=function(id){return P.get(id)};
var unionsOf=function(id){return (UOF.get(id)||[]).map(function(k){return U.get(k)})};
var partnerIn=function(u,id){ for(var i=0;i<u.p.length;i++) if(u.p[i]!==id) return u.p[i]; return null };

/* All descendants of id (each once), for counts and "more" markers. */
function descCount(id){

var SUFFIX=/^(jr\.?|sr\.?|i{1,3}|iv|v|vi{0,3}|ix|x)$/i;

/* Index numbers in the style of "The Randolphs of Virginia": one digit per generation below the tree's root,

<script data-db>
/* Descendant Builder · js/chart.js
   Chart layout and drawing, zoom and pan, the details panel and navigation.
   Generations run left to right: the person the chart starts from on the left, children in the next column, and so on.
   Each person's partners are stacked under them, and the children of each partnership branch off to the right. */
'use strict';

/* FOCUS: while showing how one person descends from the start of the tree, {id, set (the people on those lines), paths, prev} */
var FOCUS=null;

var ADDCARDS=true, ADDMAX=1500;

/* Lay out the chart for the current view and depth. Returns nodes (cards) and lines (SVG paths). */
function layout(){

    var withP=STATE.hidePartners&&!editing?[]:us.filter(function(u){return partnerIn(u,id)!=null});

  }

  later.forEach(function(o){ o.g.u.ch.forEach(function(k){ if(pn.has(k)) lines.push({cls:'far', col:k, node:pn.get(k), me:o.me, s:o.s, single:o.single, x0:o.x0, xm:o.xm, far:true}) }) });

function render(keep){

    for(var g=1;g<depth&&lay.length&&cnt<=ADDMAX;g++){ var nx=[]; lay.forEach(function(x){ childrenOf(x).forEach(function(k){ if(!seen.has(k)){ seen.add(k); nx.push(k); cnt++ } }) }); lay=nx }

/* ---------- depth ---------- */
function maxDepthOf(id){
  var best=0, seen=new Set();
  (function go(x,g){ if(g>best) best=g; if(seen.has(x+'@'+g)||g>60) return; seen.add(x+'@'+g); childrenOf(x).forEach(function(k){ go(k,g+1) }) })(id,0);
  return best+1;
}
function fillDepth(){
  var sel=$('#depth'), m=Math.max(maxDepthOf(view),1), h='';
  for(var i=1;i<=Math.max(m,depth);i++) h+='<option value="'+i+'">'+i+'</option>';
  sel.innerHTML=h; sel.value=String(depth);
}

/* ---------- zoom and pan ---------- */

  $('#zlabel').textContent=Math.round(scale*100)+'%';

}
function zoomTo(s,cx,cy){

  var wx=(vp.scrollLeft+cx)/scale, wy=(vp.scrollTop+cy)/scale;

}
/* Opening view: everything if it fits at a readable size, otherwise a readable zoom centred on the first card. */

  var ix=new Map(); STATE.people.forEach(function(p,i){ ix.set(p.id,'@I'+(i+1)+'@') });

  var txt=function(lv,tag,v){ String(v).split(/\r?\n/).forEach(function(line,i){ L.push((i?(lv+1)+' CONT ':lv+' '+tag+' ')+line) }) };
  STATE.people.forEach(function(p){
    var np=nameParts(p); L.push('0 '+ix.get(p.id)+' INDI');
    L.push('1 NAME '+[np.fn,np.mn].filter(Boolean).join(' ')+' /'+np.ln+'/'+(np.sx?' '+np.sx:''));
    if(np.fn||np.mn) L.push('2 GIVN '+[np.fn,np.mn].filter(Boolean).join(' ')); if(np.ln) L.push('2 SURN '+np.ln); if(np.sx) L.push('2 NSFX '+np.sx);
    if(p.sex) L.push('1 SEX '+p.sex);
    if(p.l) L.push('1 _LIVING Y');
    if(p.b||p.bp){ L.push('1 BIRT'); if(p.b) L.push('2 DATE '+gDate(p,'b')); if(p.bp) L.push('2 PLAC '+p.bp) }
    if(p.d||p.dp){ L.push('1 DEAT'); if(p.d) L.push('2 DATE '+gDate(p,'d')); if(p.dp) L.push('2 PLAC '+p.dp) } else if(!p.l) L.push('1 DEAT Y');
    if(p.seat){ L.push('1 RESI'); L.push('2 PLAC '+p.seat) }
    if(p.occ) L.push('1 OCCU '+p.occ);
    (p.ev||[]).forEach(function(e){ var tg=({marr:'EVEN',div:'EVEN'}[e.t]||String(e.t||'even').toUpperCase()); L.push('1 '+tg+(e.tx?' '+e.tx.replace(/\n/g,' '):'')); if(e.date) L.push('2 DATE '+e.date); if(e.pl) L.push('2 PLAC '+e.pl) });
    if(p.star) L.push('1 _STAR '+p.star); if(p.wiki) L.push('1 _WIKI '+p.wiki);
    if(p.idx) L.push('1 REFN '+p.idx);
    if(p.notes) txt(1,'NOTE',p.notes);
    (p.src||[]).forEach(function(s){ L.push('1 SOUR'); L.push('2 TITL '+s.ti); if(s.url) L.push('2 WWW '+s.url) });
    unionsOf(p.id).forEach(function(u){ L.push('1 FAMS '+fx.get(u.id)) });
    var pu=PU.get(p.id); if(pu) L.push('1 FAMC '+fx.get(pu));
  });
  STATE.unions.forEach(function(u){
    L.push('0 '+fx.get(u.id)+' FAM');
    var a=u.p.map(function(x){return P.get(x)}), h=a.filter(function(x){return x.sex==='M'})[0]||null, w=a.filter(function(x){return x!==h})[0]||null;
    if(!h&&a.length>1&&w&&w.sex!=='F'){ h=a[0]; w=a[1] }
    if(h) L.push('1 HUSB '+ix.get(h.id)); if(w) L.push('1 WIFE '+ix.get(w.id));
    if(u.m||u.mp){ L.push('1 MARR'); if(u.m) L.push('2 DATE '+gDate(u,'m')); if(u.mp) L.push('2 PLAC '+u.mp) }
    if(u.div) L.push('1 DIV Y');
    u.ch.forEach(function(c){ L.push('1 CHIL '+ix.get(c)) });
  });

  var r=P.get(STATE.root); download('descendants-'+slug(r&&r.name)+'-'+today()+'.ged',L.join('\r\n'),'text/plain;charset=utf-8');
}
function importGed(text){
  var recs=[], cur=null;
  text.split(/\r?\n/).forEach(function(line){
    var m=/^\s*(\d+)\s+(@[^@]+@)?\s*([A-Za-z0-9_]+)(?:\s(.*))?$/.exec(line); if(!m) return;
    var lv=+m[1], node={lv:lv, x:m[2]||null, tag:m[3].toUpperCase(), v:m[4]||'', kids:[]};
    if(lv===0){ cur=node; recs.push(node); node.stack=[node]; return }
    if(!cur) return; var st=cur.stack; while(st.length>lv) st.pop(); var par=st[st.length-1];
    if(node.tag==='CONT'){ par.v+='\n'+node.v; return } if(node.tag==='CONC'){ par.v+=node.v; return }
    par.kids.push(node); st.push(node);
  });
  var sub=function(n,t){ for(var i=0;i<n.kids.length;i++) if(n.kids[i].tag===t) return n.kids[i]; return null };
  var subs=function(n,t){ return n.kids.filter(function(k){return k.tag===t}) };
  var people=[], unions=[], ids=new Map();
  recs.forEach(function(r){ if(r.tag==='INDI'&&r.x) ids.set(r.x,'g'+r.x.replace(/@/g,'').replace(/[^A-Za-z0-9]/g,'')) });
  recs.forEach(function(r){
    if(r.tag!=='INDI'||!r.x) return;
    var p={id:ids.get(r.x)}, nm=sub(r,'NAME');
    if(nm){ var raw=nm.v, sur=/\/([^\/]*)\//.exec(raw), giv=sub(nm,'GIVN'), sn=sub(nm,'SURN'), sx=sub(nm,'NSFX');
      var given=giv?giv.v:raw.replace(/\/[^\/]*\//,'').trim(), last=sn?sn.v:(sur?sur[1]:'');
      var gw=given.split(/\s+/).filter(Boolean); if(gw[0]) p.fn=gw[0]; if(gw.length>1) p.mn=gw.slice(1).join(' ');
      if(last) p.ln=last.trim(); if(sx) p.sx=sx.v; else { var tail=raw.split('/').pop().trim(); if(tail) p.sx=tail }
      p.name=joinName(nameParts(p)) }
    if(!p.name) p.name='Unnamed';
    var s=sub(r,'SEX'); if(s&&/^[MF]/i.test(s.v)) p.sex=s.v.charAt(0).toUpperCase();
    if(sub(r,'_LIVING')) p.l=1;
    [['BIRT','b'],['DEAT','d']].forEach(function(e){ var ev=sub(r,e[0]); if(!ev) return; var dt=sub(ev,'DATE'), pl=sub(ev,'PLAC'); if(dt) readGDate(dt.v,p,e[1]); if(pl&&pl.v) p[e[1]+'p']=pl.v });
    var re=sub(r,'RESI'); if(re){ var rp=sub(re,'PLAC'); if(rp&&rp.v) p.seat=rp.v }
    var oc=sub(r,'OCCU'); if(oc&&oc.v) p.occ=oc.v;
    var st=sub(r,'_STAR'); if(st) p.star=st.v; var wk=sub(r,'_WIKI'); if(wk) p.wiki=wk.v; var rf=sub(r,'REFN'); if(rf) p.idx=rf.v;
    var notes=subs(r,'NOTE').map(function(n){return n.v}).filter(function(v){return v&&v.charAt(0)!=='@'}); if(notes.length) p.notes=notes.join('\n');
    var src=subs(r,'SOUR').map(function(s){ var t=sub(s,'TITL'), w=sub(s,'WWW'); var o={f:'all', ti:(t?t.v:s.v)||''}; if(w) o.url=w.v; return o }).filter(function(o){return o.ti&&o.ti.charAt(0)!=='@'});
    if(src.length) p.src=src;
    people.push(p);
  });
  recs.forEach(function(r){
    if(r.tag!=='FAM') return;
    var u={id:'g'+String(r.x||uid('f')).replace(/[^A-Za-z0-9]/g,''), p:[], ch:[]};
    ['HUSB','WIFE'].forEach(function(t){ var x=sub(r,t); if(x&&ids.has(x.v.trim())) u.p.push(ids.get(x.v.trim())) });
    subs(r,'CHIL').forEach(function(c){ if(ids.has(c.v.trim())) u.ch.push(ids.get(c.v.trim())) });
    var ma=sub(r,'MARR'); if(ma){ var dt=sub(ma,'DATE'), pl=sub(ma,'PLAC'); if(dt) readGDate(dt.v,u,'m'); if(pl&&pl.v) u.mp=pl.v }
    if(sub(r,'DIV')) u.div=1;
    if(u.p.length||u.ch.length) unions.push(u);
  });
  if(!people.length) throw new Error('No people found in this GEDCOM file.');
  STATE={v:1, app:'descendant-builder', people:people, unions:unions}; rebuild();
  var best=people[0].id, bn=-1; people.forEach(function(p){ if(parentsOf(p.id).length) return; var n=descCount(p.id); if(n>bn){ bn=n; best=p.id } });
  STATE.root=best; return STATE;
}

function stripEdit(s){ return s.replace(/\/\*\{edit\*\/[\s\S]*?\/\*\}edit\*\//g,'') }
function exportReadOnly(){
  var parts=[].slice.call(document.querySelectorAll('style[data-db],link[data-db],script[data-db]'));
  Promise.all(parts.map(function(el){
    if(el.tagName==='STYLE') return Promise.resolve('<style>'+stripEdit(el.textContent)+'</style>');
    var url=el.tagName==='LINK'?el.href:el.src;
    if(!url) return Promise.resolve('<script>'+stripEdit(el.textContent).replace(/<\/(script)/gi,'<\\/$1')+'<\/script>');
    return fetch(url).then(function(r){ return r.text() }).then(function(t){ t=stripEdit(t); return el.tagName==='LINK'?'<style>'+t+'</style>':'<script>'+t.replace(/<\/(script)/gi,'<\\/$1')+'<\/script>' });
  })).then(function(chunks){
    var css=chunks.filter(function(c){return c.indexOf('<style>')===0}).join('\n'), js=chunks.filter(function(c){return c.indexOf('<script>')===0}).join('\n');
    var data={state:STATE, view:view, depth:depth};
    var html='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(dispName(P.get(view)))+' · Descendants</title>'+
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">'+css+'</head><body>'+DB_BODY+
      '<script>window.DB_EXPORT='+JSON.stringify(data).replace(/</g,'\\u003c')+'<\/script>'+js+'</body></html>';
    download('descendants-'+slug(P.get(view).name)+'.html',html,'text/html;charset=utf-8');
  }).catch(function(){ toast('Could not build the page here. Open the app from its web address (not a file) and try again.') });
}
document.querySelector('[data-ro]').onclick=function(){ $('#viewmenu').hidden=true; exportReadOnly() };

function afterLoad(msg,keep){ rebuild(); view=STATE.root; depth=Math.min(4,maxDepthOf(view)); if(!keep) closeSheet(); setView(view); save(); toast(msg) }
/* After an import: choose who the chart starts from. Suggests the people furthest up each line (most generations below them); any person can be found by name. */
function pickRoot(){
  var tops=STATE.people.filter(function(p){ return !parentsOf(p.id).length&&childrenOf(p.id).length }).map(function(p){ return {id:p.id, g:maxDepthOf(p.id)-1} })
    .sort(function(a,b){ return b.g-a.g||descCount(b.id)-descCount(a.id) }).slice(0,12);
  var row=function(id,g){ var p=P.get(id); return '<li data-id="'+esc(id)+'"'+(id===STATE.root?' class="cur"':'')+'><b>'+esc(dispName(p))+'</b><span>'+esc([years(p), g!=null?g+(g===1?' generation':' generations')+' below':''].filter(Boolean).join(' · '))+'</span></li>' };
  var m=$('#impmsg'); m.hidden=false; m.className='okmsg rootpick';

    '<span class="combo"><input type="search" id="rpf" autocomplete="off" placeholder="Find any ancestor"><ul class="combolist" id="rpl" hidden></ul></span>'+
    '<span class="mute">Furthest back:</span><ul class="combolist rplist" id="rptop">'+tops.map(function(t){ return row(t.id,t.g) }).join('')+'</ul>';
  var choose=function(e){ var li=e.target.closest('[data-id]'); if(!li) return; var id=li.getAttribute('data-id');
